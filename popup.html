<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }

    @media (prefers-color-scheme: dark) {
      body { background-color: #1e1e1e; color: #ffffff; }
      .header { border-color: #555; }
      .header h3 { color: #ffffff !important; font-weight: 600; }
      .status-item { background: #2d2d30 !important; border: 1px solid #3e3e42; }
      .status-item span { color: #ffffff !important; }
      .info-text { background: #2d2d30 !important; border-left-color: #0b7dda; color: #ffffff !important; }
      .info-text strong { color: #ffffff !important; }
      .action-btn { background: #0e639c; color: #ffffff; }
      .action-btn:hover { background: #1177bb; }
      .secondary-btn { background: #3e3e42; color: #ffffff; }
      .secondary-btn:hover { background: #505053; }
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e0e0e0;
    }

    .header h3 {
      margin: 0;
      color: #2c3e50;
      font-size: 18px;
    }

    .status-section {
      margin-bottom: 20px;
    }

    .status-item {
      display: flex;
      align-items: center;
      margin: 10px 0;
      padding: 8px;
      border-radius: 4px;
      background: #f8f9fa;
      color: #333;
    }

    .status-item span {
      color: #333;
      font-weight: 500;
    }

    .status-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .status-configured {
      background-color: #28a745;
    }

    .status-not-configured {
      background-color: #dc3545;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    .action-btn:hover {
      background: #0056b3;
    }

    .action-btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }

    .secondary-btn {
      background: #6c757d;
    }

    .secondary-btn:hover {
      background: #545b62;
    }

    .info-text {
      font-size: 12px;
      color: #6c757d;
      margin-top: 15px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 4px;
      border-left: 3px solid #007bff;
    }
  </style>
</head>

<body>
  <div class="header">
    <h3>
      <img src="icons/icon-64.png" alt="Vikunja Uploader"
        style="height: 1em; width: 1em; vertical-align: middle; margin-right: 8px;">
      Vikunja Uploader
    </h3>
  </div>

  <div class="status-section" role="status" aria-label="Configuration status">
    <div class="status-item">
      <div class="status-icon" id="url-status" aria-hidden="true"></div>
      <span>Vikunja URL</span>
    </div>
    <div class="status-item">
      <div class="status-icon" id="token-status" aria-hidden="true"></div>
      <span>API Token</span>
    </div>
  </div>

  <button class="action-btn" id="test-connection" aria-label="Test connection to Vikunja server">Test Connection</button>
  <button class="action-btn secondary-btn" id="open-options" aria-label="Open settings to configure Vikunja URL and token">Configure Settings</button>

  <div class="info-text">
    <strong>How to use:</strong><br>
    1. Configure your Vikunja settings<br>
    2. Right-click on emails (with or without attachments)<br>
    3. Select "Upload to Vikunja"
  </div>
  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>

</html>
