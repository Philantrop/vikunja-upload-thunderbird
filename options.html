<html>

<head>
  <meta charset="utf-8">
  <title>Vikunja Uploader Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
      background-color: #f8f9fa;
      color: #333;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1e1e1e;
        color: #f0f0f0;
      }
      label {
        color: #ffffff !important;
        font-weight: 600;
      }
      input[type="text"],
      input[type="url"],
      select,
      textarea {
        background: #252526;
        color: #f0f0f0;
        border-color: #3e3e42;
      }
      input[type="text"]:focus,
      input[type="url"]:focus,
      select:focus,
      textarea:focus {
        border-color: #0e639c;
        background: #2d2d30;
      }
      .help-text {
        color: #ffffff !important;
      }
      .save-btn {
        background: #107c10;
      }
      .save-btn:hover {
        background: #0e6b0e;
      }
      .status-success {
        background-color: #1b3a1b;
        color: #90ee90;
        border-color: #2d5a2d;
      }
      .status-error {
        background-color: #3d2a2a;
        color: #ffb3b3;
        border-color: #5a3a3a;
      }
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #495057;
    }

    input[type="text"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    input[type="text"]:focus,
    input[type="url"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #007bff;
    }

    .help-text {
      font-size: 12px;
      color: #6c757d;
      margin-top: 5px;
    }

    .save-btn {
      background: #28a745;
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .save-btn:hover {
      background: #218838;
    }

    .status-message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      display: none;
    }

    .status-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f1b0b7;
    }
  </style>
</head>

<body>
  <form id="settingsForm">
      <div class="form-group">
        <label for="vikunjaUrl">Vikunja URL:</label>
        <input type="url" id="vikunjaUrl" name="vikunjaUrl" 
               placeholder="https://vikunja.yourdomain.com" 
               aria-label="Vikunja server URL"
               aria-describedby="urlHelp"
               required>
        <div class="help-text" id="urlHelp">Include http:// or https:// (no trailing slash)</div>
      </div>

      <div class="form-group">
        <label for="vikunjaToken">API Token:</label>
        <input type="text" id="vikunjaToken" name="vikunjaToken" 
               placeholder="your-api-token-here" 
               aria-label="Vikunja API authentication token"
               aria-describedby="tokenHelp"
               required>
        <div class="help-text" id="tokenHelp">Your Vikunja API authentication token</div>
      </div>

      <div class="form-group" id="fetchProjectsGroup">
        <button type="button" id="fetchProjects" class="save-btn" style="width: auto; background: #6c757d;">
          Fetch Projects
        </button>
        <div class="help-text">Click to load your Vikunja projects after entering URL and Token</div>
      </div>

      <div class="form-group" id="projectSelectGroup" style="display: none;">
        <label for="vikunjaProject">Project:</label>
        <select id="vikunjaProject" name="vikunjaProject" 
                aria-label="Vikunja project for tasks"
                aria-describedby="projectHelp"
                required>
          <option value="">Select a project...</option>
        </select>
        <div class="help-text" id="projectHelp">The project where tasks will be created</div>
      </div>

      <div class="form-group">
        <label for="defaultTags">Default Tags (optional):</label>
        <input type="text" id="defaultTags" name="defaultTags" 
               placeholder="email, thunderbird, imported"
               aria-label="Default tags for uploaded documents"
               aria-describedby="tagsHelp">
        <div class="help-text" id="tagsHelp">Comma-separated tags to apply to uploaded documents</div>
      </div>

      <button type="submit" class="save-btn">Save Settings</button>

      <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
    </form>

  <script src="utils.js"></script>
  <script src="options.js"></script>
</body>

</html>
